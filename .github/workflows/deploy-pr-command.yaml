name: Deploy Pull Request
on:
  repository_dispatch:
    types: [deploy-command]

permissions:
  pull-requests: write  # comment on the pull request with the deployed version
  deployments: write  # create the test.pypi.org deployment and update its status
  contents: read

jobs:
  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    environment:
      name: test.pypi.org
    steps:
      - name: Create deployment
        id: create_deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.client_payload.pull_request.head.sha }}
        run: |
          deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="$PR_SHA" -f environment=test.pypi.org -F auto_merge=false --jq .id)"
          echo "id=${deployment_id}" >> "$GITHUB_OUTPUT"

      - name: Set deployment status to in progress
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f environment=test.pypi.org \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f state=in_progress

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.client_payload.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Create custom version
        id: create-custom-version
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/version"
          SDIST="$(basename "$RUNNER_TEMP"/version/signalbot-*.tar.gz .tar.gz)"
          # Untagged commits build as e.g. 2.2.1.dev3+1a2b3c4, which isn't unique and TestPyPI rejects the +1a2b3c4
          base_version="${SDIST#signalbot-}"
          base_version="${base_version%%.dev*}"
          pr_version="${base_version}a$(date +%s)"
          echo "The custom version is ${pr_version}"
          echo "pr_version=${pr_version}" >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          UV_DYNAMIC_VERSIONING_BYPASS: ${{ steps.create-custom-version.outputs.pr_version }}
        run: uv build

      - name: Publish package
        run: uv publish --index testpypi --token ${{ secrets.API_TOKEN }}  # zizmor: ignore[use-trusted-publishing]

      - name: Write comment in Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pull_request.number }}
          PR_VERSION: ${{ steps.create-custom-version.outputs.pr_version }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          Pull Request has been deployed on test.pypi.org: [${PR_VERSION}](https://test.pypi.org/project/signalbot/${PR_VERSION}/) :rocket: You can test the package by running
          \`\`\`bash
          pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple signalbot==${PR_VERSION}
          \`\`\`
          EOF

      - name: Set deployment status to success
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.id }}
          PR_VERSION: ${{ steps.create-custom-version.outputs.pr_version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f environment=test.pypi.org \
            -f environment_url="https://test.pypi.org/project/signalbot/${PR_VERSION}/" \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f state=success

      - name: Set deployment status to failure
        # Skipped if the deployment itself could not be created
        if: failure() && steps.create_deployment.outputs.id
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.id }}
          PR_VERSION: ${{ steps.create-custom-version.outputs.pr_version }}
        run: |-
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f environment=test.pypi.org \
            -f environment_url="https://test.pypi.org/project/signalbot/${PR_VERSION}/" \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f state=failure
