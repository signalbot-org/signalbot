name: Deploy Pull Request
on:
  repository_dispatch:
    types: [deploy-command]

permissions:
  pull-requests: write
  deployments: write
  contents: read

jobs:
  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    environment:
      name: test.pypi.org
    steps:
      - name: Create deployment
        id: create_deployment
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae  # v3.0.0
        with:
          route: POST /repos/:repository/deployments
        env:
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_REF: ${{ github.event.client_payload.pull_request.head.sha }}
          INPUT_ENVIRONMENT: test.pypi.org
          INPUT_AUTO_MERGE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set deployment status to in progress
        id: start_deployment
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae  # v3.0.0
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          deployment: ${{ fromJson(steps.create_deployment.outputs.data).id }}
          environment: test.pypi.org
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          state: in_progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPOSITORY: ${{ github.repository }}

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.client_payload.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Create custom version
        id: create-custom-version
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/version"
          SDIST="$(basename "$RUNNER_TEMP"/version/signalbot-*.tar.gz .tar.gz)"
          # Untagged commits build as e.g. 2.2.1.dev3+1a2b3c4, which isn't unique and TestPyPI rejects the +1a2b3c4
          base_version="${SDIST#signalbot-}"
          base_version="${base_version%%.dev*}"
          pr_version="${base_version}a$(date +%s)"
          echo "The custom version is ${pr_version}"
          echo "pr_version=${pr_version}" >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          UV_DYNAMIC_VERSIONING_BYPASS: ${{ steps.create-custom-version.outputs.pr_version }}
        run: uv build

      - name: Publish package
        run: uv publish --index testpypi --token ${{ secrets.API_TOKEN }}  # zizmor: ignore[use-trusted-publishing]

      - name: Write comment in Pull Request
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          issue-number: ${{ github.event.client_payload.pull_request.number }}
          body: |
            Pull Request has been deployed on test.pypi.org: [${{ steps.create-custom-version.outputs.pr_version }}](https://test.pypi.org/project/signalbot/${{ steps.create-custom-version.outputs.pr_version }}/) :rocket: You can test the package by running
            ```bash
            pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple signalbot==${{ steps.create-custom-version.outputs.pr_version }}
            ```

      - name: Set deployment status to success
        id: successful_deployment
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae  # v3.0.0
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          deployment: ${{ fromJson(steps.create_deployment.outputs.data).id }}
          environment: test.pypi.org
          environment_url: https://test.pypi.org/project/signalbot/${{ steps.create-custom-version.outputs.pr_version }}/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          state: success
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPOSITORY: ${{ github.repository }}

      - name: Set deployment status to failure
        id: failed_deployment
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae  # v3.0.0
        if: failure()
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          deployment: ${{ fromJson(steps.create_deployment.outputs.data).id }}
          environment: test.pypi.org
          environment_url: https://test.pypi.org/project/signalbot/${{ steps.create-custom-version.outputs.pr_version }}/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          state: failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPOSITORY: ${{ github.repository }}
