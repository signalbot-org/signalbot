name: Deploy Pull Request
on:
  repository_dispatch:
    types: [deploy-command]

permissions:
  contents: read

jobs:
  # Runs the pull request's code, only has read repository permissions
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    outputs:
      pr_version: ${{ steps.create-custom-version.outputs.pr_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.client_payload.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock
          enable-cache: false  # the pull request's code must not write a cache that trusted workflows restore

      - name: Create custom version
        id: create-custom-version
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/version"
          SDIST="$(basename "$RUNNER_TEMP"/version/signalbot-*.tar.gz .tar.gz)"
          # Untagged commits build as e.g. 2.2.1.dev3+1a2b3c4, which isn't unique and TestPyPI rejects the +1a2b3c4
          base_version="${SDIST#signalbot-}"
          base_version="${base_version%%.dev*}"
          pr_version="${base_version}a$(date +%s)"
          echo "The custom version is ${pr_version}"
          echo "pr_version=${pr_version}" >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          UV_DYNAMIC_VERSIONING_BYPASS: ${{ steps.create-custom-version.outputs.pr_version }}
        run: uv build

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: build-package
    permissions:
      pull-requests: write  # comment on the pull request with the deployed version
      id-token: write  # trusted publishing to test.pypi.org
    environment:
      name: test.pypi.org
      url: https://test.pypi.org/project/signalbot/${{ needs.build-package.outputs.pr_version }}/
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Write comment in Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pull_request.number }}
          PR_VERSION: ${{ needs.build-package.outputs.pr_version }}
        run: |-
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          Pull Request has been deployed on test.pypi.org: [${PR_VERSION}](https://test.pypi.org/project/signalbot/${PR_VERSION}/) :rocket: You can test the package by running
          \`\`\`bash
          pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple signalbot==${PR_VERSION}
          \`\`\`
          Built and published by [this workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          EOF
