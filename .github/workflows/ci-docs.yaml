name: CI Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**  # If the documentation files changed
      - zensical.toml  # If the Zensical configuration changed
      - uv.lock  # If the dependencies changed (in case docs dependencies were updated)

  pull_request:
    branches: [main]
    paths: [docs/**, zensical.toml, uv.lock]

permissions:
  contents: read

jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build documentation
        run: uv run zensical build --strict
