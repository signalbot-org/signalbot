name: Release Package

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yaml

  check-version:
    name: Build and check the package version matches the tag
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.get-version.outputs.package_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock

      - name: Build package
        run: uv build

      - name: Get Package Version
        id: get-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SDIST="$(basename dist/signalbot-*.tar.gz .tar.gz)"
          PACKAGE_VERSION="${SDIST#signalbot-}"
          if [ "v${PACKAGE_VERSION}" != "$RELEASE_TAG" ]; then
            echo "::error::The tag ${RELEASE_TAG} does not match the built version ${PACKAGE_VERSION}"
            exit 1
          fi
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-pypi:
    name: Publish (pypi.org)
    runs-on: ubuntu-latest
    needs: [ci, check-version]
    permissions:
      id-token: write  # trusted publishing to pypi.org
    environment:
      name: pypi.org
      url: https://pypi.org/project/signalbot/${{ needs.check-version.outputs.package_version }}/
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # Created last, so that every GitHub release is also on PyPI
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write  # create the GitHub release
      pull-requests: read  # git-cliff links each commit to its PR
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock
          enable-cache: false  # only git-cliff is installed, which the cache would not keep

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --only-group release git-cliff --body-file .github/release-notes.md.tera --current \
            --output "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"

  deploy-docs:
    name: Deploy docs
    needs: release
    permissions:
      contents: write  # deploy-docs pushes the docs to the gh-pages branch
    uses: $/.github/workflows/deploy-docs.yaml
