name: Release Package

on:
  push:
    tags: [v*]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  check-version:
    name: Check the package version matches the tag
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.get-version.outputs.package_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock

      - name: Build package
        run: uv build --sdist

      - name: Get Package Version
        id: get-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SDIST="$(basename dist/signalbot-*.tar.gz .tar.gz)"
          PACKAGE_VERSION="${SDIST#signalbot-}"
          if [ "v${PACKAGE_VERSION}" != "$RELEASE_TAG" ]; then
            echo "::error::The tag ${RELEASE_TAG} does not match the built version ${PACKAGE_VERSION}"
            exit 1
          fi
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

  publish-pypi:
    name: Publish (pypi.org)
    runs-on: ubuntu-latest
    needs: [ci, check-version]
    environment:
      name: pypi.org
      url: https://pypi.org/project/signalbot/${{ needs.check-version.outputs.package_version }}/
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish --token ${{ secrets.API_TOKEN }}

  # Created last, so that every GitHub release is also on PyPI
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # GitHub's generated notes, grouped by the conventional commit prefix of the PR titles
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body \
            | python3 .github/scripts/release_notes.py > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"

  deploy-docs:
    name: Deploy docs
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-docs.yaml
