name: CI

on:
  # tests can be called from other workflows
  workflow_call:

  # always run tests for every push to main
  push:
    branches: [main]

  # always run tests for every PR
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prek:
    name: Run code checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group examples

      - name: Run prek
        run: uv run prek run --all-files --show-diff-on-failure --color=always

  unittest:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version-file: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group examples

      - name: Run unit tests
        run: uv run pytest --cov=src/signalbot --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
